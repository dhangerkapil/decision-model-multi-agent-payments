# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Payments Trust Fabric: a hosted multi-agent workflow in Microsoft Foundry where Microsoft-Decision-1 makes the decisions.
# `azd up` provisions infra/ (Bicep), deploys the hosted agent (code deploy, remote build) and the console (Azure
# Container Apps), then grants the agent identity access to Microsoft-Decision-1 (postdeploy hook).
name: decision-model-multi-agent-payments
metadata:
    template: decision-model-multi-agent-payments@1.0.0
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.19'
infra:
    provider: bicep
    path: infra
services:
    decision-payments-agent:
        project: src/payments-trust-fabric
        host: azure.ai.agent
        language: python
        kind: hosted
        name: decision-payments-agent
        description: 'Payments Trust Fabric: Microsoft-Decision-1 makes fast, calibrated trust decisions for agentic checkout, disputes, merchant integrity and scam protection; LLM agents write the messages; people own adverse actions.'
        codeConfiguration:
            runtime: python_3_13
            entryPoint: main.py
            dependencyResolution: remote_build
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: LLM_STANDARD_DEPLOYMENT
              value: ${LLM_STANDARD_DEPLOYMENT}
            - name: LLM_PREMIUM_DEPLOYMENT
              value: ${LLM_PREMIUM_DEPLOYMENT}
            - name: DECISION_ENDPOINT
              value: ${DECISION_ENDPOINT}
            - name: DECISION_MODEL_DEPLOYMENT
              value: ${DECISION_MODEL_DEPLOYMENT}
            - name: DECISION_RPM_PER_DEPLOYMENT
              value: ${DECISION_RPM_PER_DEPLOYMENT}
        protocols:
            - protocol: responses
              version: 2.0.0
        metadata:
            tags:
                - Agent Framework
                - Microsoft-Decision-1
                - Payments
                - Agentic Commerce
    console:
        project: console
        host: containerapp
        language: python
        docker:
            path: Dockerfile
            context: ..
            remoteBuild: true
hooks:
    postdeploy:
        windows:
            shell: pwsh
            run: python ./scripts/grant_agent_access.py
            interactive: false
            continueOnError: false
        posix:
            shell: sh
            run: python3 ./scripts/grant_agent_access.py
            interactive: false
            continueOnError: false
